<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Inors Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background: #0e0e12;
            color: #ccc;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header {
            padding: 20px 0 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2a2a30;
            position: relative;
        }
        .burger-menu {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            padding: 12px 12px 12px 0;
            z-index: 100;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .burger-menu span {
            display: block;
            width: 28px;
            height: 3px;
            background: #aab;
            border-radius: 3px;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .burger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .burger-menu.active span:nth-child(2) {
            opacity: 0;
            transform: scale(0);
        }
        .burger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #ddd;
            margin-left: 10px;
            flex: 1;
        }
        .logo span { font-weight: 400; color: #888; }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            background: #1a1a22;
            border: 1px solid #2a2a30;
            border-radius: 8px;
            padding: 8px 0;
            min-width: 200px;
            display: none;
            flex-direction: column;
            z-index: 99;
        }
        .dropdown-menu.open { display: flex; }
        .dropdown-menu a {
            color: #bbb;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: 400;
            transition: background 0.15s ease;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            border-left: 3px solid transparent;
        }
        .dropdown-menu a:hover {
            background: #2a2a32;
            color: #fff;
            border-left-color: #6a8cff;
        }
        .dropdown-menu a.active-link {
            color: #fff;
            border-left-color: #6a8cff;
            background: rgba(106, 140, 255, 0.06);
        }
        @media (hover: none) {
            .dropdown-menu a:active {
                background: #2a2a32;
                color: #fff;
                border-left-color: #6a8cff;
            }
        }

        .content { padding: 40px 0; }
        
        .page {
            display: none;
            animation: fadePage 0.3s ease forwards;
        }
        .page.active {
            display: block;
        }
        @keyframes fadePage {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #eee;
        }
        .page-title span { color: #6a8cff; }
        .home-hero { padding: 40px 0; }
        .home-hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            color: #eee;
            margin-bottom: 20px;
        }
        .home-hero p {
            font-size: 1.2rem;
            color: #aaa;
            max-width: 700px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 10px 0;
        }
        .game-card {
            background: #1a1a22;
            border-radius: 16px;
            border: 1px solid #2a2a30;
            overflow: hidden;
            transition: border-color 0.2s ease, background 0.2s ease;
            cursor: pointer;
        }
        .game-card:hover {
            border-color: #6a8cff;
            background: #1e1e28;
        }
        .game-card .game-screenshot {
            width: 100%;
            height: 180px;
            background: #121218;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #2a2a30;
            overflow: hidden;
        }
        .game-card .game-screenshot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .game-card .game-screenshot .no-image {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.10);
            text-transform: uppercase;
            user-select: none;
        }
        .game-card .game-info {
            padding: 16px 18px 18px;
            background: #1a1a22;
        }
        .game-card .game-info .game-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #eee;
            margin-bottom: 4px;
        }
        .game-card .game-info .game-title span {
            color: #6a8cff;
        }
        .game-card .game-info .game-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 4px 0 6px;
            font-size: 0.75rem;
            color: #888;
        }
        .game-card .game-info .game-meta .badge {
            background: #6a8cff;
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .game-card .game-info .game-meta .year {
            color: #6a8cff;
            font-weight: 600;
        }
        .game-card .game-info .game-description {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-top: 4px;
        }

        .game-page-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 14, 18, 0.96);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
            animation: fadePage 0.25s ease;
        }
        .game-page-overlay.open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .game-page-overlay .overlay-content {
            max-width: 800px;
            width: 100%;
            background: #1a1a22;
            border-radius: 16px;
            border: 1px solid #2a2a30;
            padding: 30px;
            position: relative;
            margin: auto;
        }
        .game-page-overlay .close-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 10;
            touch-action: manipulation;
        }
        .game-page-overlay .close-overlay:hover {
            background: rgba(255,255,255,0.08);
        }
        .game-page-overlay .close-overlay span {
            display: block;
            width: 20px;
            height: 2px;
            background: #aaa;
            border-radius: 2px;
            position: absolute;
            transition: all 0.3s ease;
        }
        .game-page-overlay .close-overlay span:nth-child(1) {
            transform: rotate(45deg);
        }
        .game-page-overlay .close-overlay span:nth-child(2) {
            transform: rotate(-45deg);
        }
        .game-page-overlay .overlay-image {
            width: 100%;
            height: 250px;
            background: #121218;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #2a2a30;
            overflow: hidden;
        }
        .game-page-overlay .overlay-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .game-page-overlay .overlay-image .no-image {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.10);
            text-transform: uppercase;
            user-select: none;
        }
        .game-page-overlay .overlay-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #eee;
            margin-bottom: 8px;
        }
        .game-page-overlay .overlay-title span {
            color: #6a8cff;
        }
        .game-page-overlay .overlay-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #888;
        }
        .game-page-overlay .overlay-meta .badge {
            background: #6a8cff;
            color: #fff;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .game-page-overlay .overlay-meta .year {
            color: #6a8cff;
            font-weight: 600;
        }
        .game-page-overlay .overlay-description {
            color: #aaa;
            font-size: 1rem;
            line-height: 1.8;
            margin: 12px 0 24px;
        }
        .game-page-overlay .overlay-description p {
            margin-bottom: 10px;
        }
        .game-page-overlay .overlay-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .game-page-overlay .overlay-links .btn {
            display: inline-block;
            background: #2a2a36;
            color: #eee;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #3a3a46;
            transition: background 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .game-page-overlay .overlay-links .btn:hover {
            background: #3a3a4a;
            border-color: #6a8cff;
        }
        .game-page-overlay .overlay-links .btn.primary {
            background: #6a8cff;
            border-color: #6a8cff;
            color: #fff;
        }
        .game-page-overlay .overlay-links .btn.primary:hover {
            background: #5a7cee;
            border-color: #5a7cee;
        }

        .news-list { display: flex; flex-direction: column; gap: 0; }
        .news-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 18px;
            border-bottom: 1px solid #1a1a26;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .news-item:first-child {
            border-top: 1px solid #1a1a26;
        }
        .news-item:hover {
            background: #1a1a22;
        }
        .news-item .news-date {
            font-size: 0.7rem;
            color: #6a8cff;
            font-weight: 600;
            min-width: 60px;
            padding-top: 2px;
        }
        .news-item .news-content {
            flex: 1;
        }
        .news-item .news-content h4 {
            font-size: 1rem;
            color: #eee;
            font-weight: 600;
            margin: 0 0 4px 0;
            line-height: 1.4;
        }
        .news-item .news-content .news-preview {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 0;
        }
        .news-item .news-content .read-more {
            color: #6a8cff;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
            margin-top: 6px;
        }
        .news-item .news-content .read-more:hover {
            text-decoration: underline;
        }
        .news-item .news-image {
            max-width: 100px;
            max-height: 70px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            margin: 0;
        }
        .news-item .news-sticker {
            max-width: 60px;
            max-height: 60px;
            border-radius: 8px;
            margin-top: 6px;
        }

        .polls-list { display: flex; flex-direction: column; gap: 0; }
        .poll-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 18px;
            border-bottom: 1px solid #1a1a26;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .poll-item:first-child {
            border-top: 1px solid #1a1a26;
        }
        .poll-item:hover {
            background: #1a1a22;
        }
        .poll-item .poll-date {
            font-size: 0.7rem;
            color: #6a8cff;
            font-weight: 600;
            min-width: 60px;
            padding-top: 2px;
        }
        .poll-item .poll-content {
            flex: 1;
        }
        .poll-item .poll-content h4 {
            font-size: 1rem;
            color: #eee;
            font-weight: 600;
            margin: 0 0 4px 0;
            line-height: 1.4;
        }
        .poll-item .poll-content .poll-preview {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 0;
        }
        .poll-item .poll-content .poll-vote-btn {
            color: #6a8cff;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
            margin-top: 6px;
        }
        .poll-item .poll-content .poll-vote-btn:hover {
            text-decoration: underline;
        }
        .poll-item .poll-sticker {
            max-width: 60px;
            max-height: 60px;
            border-radius: 8px;
            margin-top: 6px;
        }

            margin-bottom: 6px;
        }
        .poll-overlay .overlay-poll-question {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .poll-overlay .overlay-poll-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            margin-bottom: 8px;
            border-radius: 12px;

<script>
    document.addEventListener('DOMContentLoaded', function() {
        
        const SUPABASE_URL = 'https://cdmzvyfsuyzqqnekuzfa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkbXp2eWZzdXl6cXFuZWt1emZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzE4MDgsImV4cCI6MjEwMzk0NzgwOH0.oBjQXyu4YrzXstdUI-CnPWgE_tHVwSIuBmj1_8wnbrI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // 🎮 ИГРЫ
        // ============================================
        let allGamesData = [];

        async function loadGames() {
            const container = document.getElementById('gamesContainer');
            if (!container) return;
            
            try {
                const { data, error } = await supabase
                    .from('games')
                    .select('*')

                if (error) throw error;

                allGamesData = data || [];

                if (data && data.length > 0) {
                    renderGames(data);
                } else {
                    container.innerHTML = `
                        <div class="empty-news">

                            <br><small style="color:#555;">Скоро появятся!</small>

                    `;

                `;
            }
        }

        function renderGames(gamesArray) {
            const container = document.getElementById('gamesContainer');
            if (!container || !gamesArray || gamesArray.length === 0) {
                container.innerHTML = `
                    <div class="empty-news">
                        <span>🎮</span>
                        Игр пока нет.
                    </div>
                `;
                return;
            }

            let html = '<div class="games-grid">';
            gamesArray.forEach(game => {
                const hasImage = game.image_url && game.image_url.trim() !== '';
                html += `
                    <div class="game-card" data-game-id="${game.id}">
                        <div class="game-screenshot">
                            ${hasImage ? `<img src="${game.image_url}" alt="${game.title}" loading="lazy" />` : `<div class="no-image">Фото</div>`}
                        </div>
                        <div class="game-info">
                            <div class="game-title">${game.title || 'Без названия'}</div>
                            <div class="game-meta">
                                ${game.genre ? `<span class="badge">${game.genre}</span>` : ''}
                                ${game.year ? `<span class="year">${game.year}</span>` : ''}
                                ${game.platform ? `<span>${game.platform}</span>` : ''}
                            </div>
                            <div class="game-description">${game.description || ''}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            document.querySelectorAll('.game-card').forEach(el => {
                el.addEventListener('click', function() {
                    const id = parseInt(this.dataset.gameId);
                    const game = allGamesData.find(g => g.id === id);
                    if (game) openGameOverlay(game);
                });
            });
        }

        const gameOverlay = document.getElementById('gamePageOverlay');
        const gameOverlayContent = document.getElementById('gameOverlayContent');
        const closeGameBtn = document.getElementById('closeGamePage');

        function openGameOverlay(game) {
            const hasImage = game.image_url && game.image_url.trim() !== '';
            const hasDownload = game.download_link && game.download_link.trim() !== '';
            
            let html = `
                <div class="overlay-image">
                    ${hasImage ? `<img src="${game.image_url}" alt="${game.title}" loading="lazy" />` : `<div class="no-image">Фото</div>`}
                </div>
                <div class="overlay-title">${game.title || 'Без названия'}</div>
                <div class="overlay-meta">
                    ${game.genre ? `<span class="badge">${game.genre}</span>` : ''}
                    ${game.year ? `<span class="year">${game.year}</span>` : ''}
                    ${game.platform ? `<span>${game.platform}</span>` : ''}
                    <span>Inors Games</span>
                </div>
                <div class="overlay-description">
                    <p>${game.description || ''}</p>
                </div>
                <div class="overlay-links">
                    ${hasDownload ? `<a href="${game.download_link}" target="_blank" class="btn primary">Скачать игру</a>` : ''}
                    <a href="https://t.me/life_in_russia_simulator" target="_blank" class="btn">Наш Telegram</a>
                </div>
            `;
            
            gameOverlayContent.innerHTML = html;
            gameOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeGameOverlay() {
            gameOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        closeGameBtn.addEventListener('click', closeGameOverlay);
        gameOverlay.addEventListener('click', function(e) {
            if (e.target === gameOverlay) closeGameOverlay();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && gameOverlay.classList.contains('open')) closeGameOverlay();
        });

        // ============================================
        // 📰 НОВОСТИ
        // ============================================
        let allNewsData = [];

        async function loadNews() {
            const container = document.getElementById('newsContainer');
            if (!container) return;
            
            try {
                const { data, error } = await supabase
                    .from('news')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;

                allNewsData = data || [];

                if (data && data.length > 0) {
                    renderNews(data);
                } else {
                    container.innerHTML = `
                        <div class="empty-news">
                            <span>📭</span>
                            Новостей пока нет.
                            <br><small style="color:#555;">Скоро появятся!</small>
                        </div>
                    `;
                }
            } catch (e) {
                console.error('Ошибка загрузки новостей:', e);
                container.innerHTML = `
                    <div class="empty-news" style="border-color:#6a3c3c;">
                        <span>⚠️</span>
                        Ошибка загрузки новостей
                    </div>
                `;
            }
        }

        function renderNews(newsArray) {
            const container = document.getElementById('newsContainer');
            if (!container || !newsArray || newsArray.length === 0) {
                container.innerHTML = `
                    <div class="empty-news">
                        <span>📭</span>
                        Новостей пока нет.
                    </div>
                `;
                return;
            }

            let html = '<div class="news-list">';
            newsArray.forEach(item => {
                const formattedDate = formatDateShort(item.date);
                const preview = item.content ? item.content.substring(0, 120) + (item.content.length > 120 ? '...' : '') : '';
                
                html += `
                    <div class="news-item" data-news-id="${item.id}">
                        <div class="news-date">${formattedDate}</div>
                        <div class="news-content">
                            <h4>${item.title || 'Без названия'}</h4>
                            ${preview ? `<div class="news-preview">${preview}</div>` : ''}
                            <div class="read-more">Читать полностью →</div>
                            ${item.image_url ? `<img src="${item.image_url}" class="news-image" alt="изображение" loading="lazy" />` : ''}
                            ${item.sticker ? `<img src="${item.sticker}" class="news-sticker" />` : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            document.querySelectorAll('.news-item').forEach(el => {
                el.addEventListener('click', function() {
                    const id = parseInt(this.dataset.newsId);
                    const news = allNewsData.find(n => n.id === id);
                    if (news) openNewsOverlay(news);
                });
            });
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;
                const now = new Date();
                const diff = Math.floor((now - date) / (1000 * 60));
                if (diff < 1) return 'Только что';
                if (diff < 60) return diff + ' мин';
                if (diff < 1440) return Math.floor(diff / 60) + ' ч';
                if (diff < 43200) return Math.floor(diff / 1440) + ' д';
                return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            } catch {
                return dateStr;
            }
        }

        // ============================================
        // 💬 ОТПРАВКА КОММЕНТАРИЯ
        // ============================================
        async function sendComment(newsId) {
            const authorInput = document.getElementById('commentAuthor');
            const textInput = document.getElementById('commentText');
            const btn = document.getElementById('sendCommentBtn');
            
            const author = authorInput.value.trim() || 'Аноним';
            const content = textInput.value.trim();
            
            if (!content) {
                alert('Напишите комментарий');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const { error } = await supabase
                    .from('comments')
                    .insert([{
                        news_id: newsId,
                        author: author,
                        content: content
                    }]);

                if (error) throw error;

                // Очищаем поле
                textInput.value = '';
                // Обновляем список комментариев
                loadComments(newsId);
                btn.textContent = 'Отправлено ✅';
                setTimeout(() => { btn.textContent = 'Отправить'; btn.disabled = false; }, 2000);
            } catch (e) {
                console.error('Ошибка отправки комментария:', e);
                alert('Не удалось отправить комментарий');
                btn.textContent = 'Отправить';
                btn.disabled = false;
            }
        }

        // ============================================
        // 📖 ОТКРЫТИЕ НОВОСТИ + КОММЕНТАРИИ
        // ============================================
        const newsOverlay = document.getElementById('newsOverlay');
        const newsOverlayContent = document.getElementById('newsOverlayContent');
        const closeNewsOverlayBtn = document.getElementById('closeNewsOverlay');

        async function openNewsOverlay(news) {
            const formattedDate = formatDate(news.date);
            const content = news.content || '';
            const paragraphs = content.split('\n').filter(p => p.trim());
            
            let html = `
                <div class="overlay-news-title">${news.title || 'Без названия'}</div>
                <span class="overlay-news-date">${formattedDate}</span>
            `;
            
            if (news.image_url) {
                html += `<img src="${news.image_url}" class="overlay-news-image" alt="изображение" loading="lazy" />`;
            }
            
            if (news.sticker) {
                html += `<img src="${news.sticker}" class="overlay-news-sticker" />`;
            }
            
            html += `<div class="overlay-news-content">`;
            paragraphs.forEach(p => { html += `<p>${p}</p>`; });
            html += `</div>`;
            
            // Загружаем голосование
            try {
                const { data: pollData, error } = await supabase
                    .from('polls')
                    .select('*')
                    .eq('news_id', news.id)
                    .single();

                if (!error && pollData) {
                    html += renderPoll(pollData);
                }
            } catch (e) {
                console.log('Нет голосования для этой новости');
            }
            
            // === КОММЕНТАРИИ (без смайла) ===
            html += `<div class="comments-section" id="commentsSection">`;
            html += `<div class="comments-title">Комментарии</div>`;
            html += `<div id="commentsList"></div>`;
            html += `
                <div class="comment-form">
                    <div class="form-row">
                        <input type="text" id="commentAuthor" placeholder="Ваше имя" maxlength="30" />
                    </div>
                    <textarea id="commentText" placeholder="Напишите комментарий..." rows="2"></textarea>
                    <button class="comment-btn" id="sendCommentBtn" data-news-id="${news.id}">Отправить</button>
                </div>
            `;
            html += `</div>`;
            
            newsOverlayContent.innerHTML = html;
            newsOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';

            // Загружаем комментарии для этой новости
            loadComments(news.id);
            
            // Обработчик отправки комментария
            document.getElementById('sendCommentBtn').addEventListener('click', function() {
                const newsId = parseInt(this.dataset.newsId);
                sendComment(newsId);
            });

            // Обработчики голосования (если есть)
            attachPollHandlers();
        }

        function closeNewsOverlay() {
            newsOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        closeNewsOverlayBtn.addEventListener('click', closeNewsOverlay);
        newsOverlay.addEventListener('click', function(e) {
            if (e.target === newsOverlay) closeNewsOverlay();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && newsOverlay.classList.contains('open')) closeNewsOverlay();
        });

        function formatDate(dateStr) {
            if (!dateStr) return 'Без даты';
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;
                return date.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            } catch {
                return dateStr;
            }
        }

        // ============================================
        // 🗳️ ГОЛОСОВАНИЯ
        // ============================================
        let isVotingInProgress = false;

        function renderPoll(pollData) {
            if (!pollData) return '';
            
            const options = pollData.options || [];
            const votes = pollData.votes || options.map(() => 0);
            const totalVotes = votes.reduce((a, b) => a + b, 0);
            const hasVoted = localStorage.getItem('poll_voted_' + pollData.id) === 'true';
            const images = pollData.images || [];

            let html = `<div class="poll-container" data-poll-id="${pollData.id}">`;
            
            const validImages = images.filter(img => img && img.trim() !== '');
            if (validImages.length > 0) {
                html += `<div class="poll-images">`;
                validImages.forEach(img => {
                    html += `<img src="${img}" alt="Фото" loading="lazy" />`;
                });
                html += `</div>`;
            }
            
            html += `
                <div class="poll-header">
                    <span class="poll-icon">📊</span>
                    <span class="poll-question">${pollData.question || 'Голосование'}</span>
                </div>
            `;

            options.forEach((option, index) => {
                const voteCount = votes[index] || 0;
                const percent = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;
                const isSelected = hasVoted && localStorage.getItem('poll_selected_' + pollData.id) === String(index);

                html += `
                    <div class="poll-option ${hasVoted ? 'disabled' : ''} ${isSelected ? 'voted' : ''}" 
                         data-index="${index}" 
                         data-poll-id="${pollData.id}"
                         data-voted="${hasVoted ? 'true' : 'false'}">
                        <div class="poll-bar" style="width:${percent}%;"></div>
                        <div class="poll-label">
                            <div class="poll-radio"></div>
                            <span class="poll-text">${option}</span>
                            <span class="poll-votes-count">${voteCount} гол.</span>
                            <span class="poll-percent">${percent}%</span>
                        </div>
                    </div>
                `;
            });

            html += `<div class="poll-total">Всего голосов: ${totalVotes}</div>`;
            if (hasVoted) html += `<div class="poll-message">✅ Вы уже проголосовали</div>`;
            html += `</div>`;

            return html;
        }

        function attachPollHandlers() {
            document.querySelectorAll('.poll-option:not(.disabled)').forEach(el => {
                const newEl = el.cloneNode(true);
                el.parentNode.replaceChild(newEl, el);
            });

            document.querySelectorAll('.poll-option:not(.disabled)').forEach(el => {
                el.addEventListener('click', handlePollClick);
            });
        }

        async function handlePollClick(e) {
            const el = this;
            const pollId = parseInt(el.dataset.pollId);
            const optionIndex = parseInt(el.dataset.index);
            
            if (isVotingInProgress) return;
            if (localStorage.getItem('poll_voted_' + pollId) === 'true') return;

            isVotingInProgress = true;
            el.style.opacity = '0.5';
            el.style.pointerEvents = 'none';

            try {
                const { data: poll, error: fetchError } = await supabase
                    .from('polls')
                    .select('*')
                    .eq('id', pollId)
                    .single();

                if (fetchError || !poll) {
                    isVotingInProgress = false;
                    el.style.opacity = '1';
                    el.style.pointerEvents = 'auto';
                    return;
                }

                const votes = poll.votes || poll.options.map(() => 0);
                votes[optionIndex] = (votes[optionIndex] || 0) + 1;

                const { error: updateError } = await supabase
                    .from('polls')
                    .update({ votes: votes })
                    .eq('id', pollId);

                if (updateError) {
                    isVotingInProgress = false;
                    el.style.opacity = '1';
                    el.style.pointerEvents = 'auto';
                    return;
                }

                localStorage.setItem('poll_voted_' + pollId, 'true');
                localStorage.setItem('poll_selected_' + pollId, String(optionIndex));

                isVotingInProgress = false;
                el.style.opacity = '1';
                el.style.pointerEvents = 'auto';

                const { data: newPoll } = await supabase
                    .from('polls')
                    .select('*')
                    .eq('id', pollId)
                    .single();

                if (newPoll) {
                    const container = el.closest('.poll-container');
                    if (container) {
                        const newHtml = renderPoll(newPoll);
                        container.outerHTML = newHtml;
                        attachPollHandlers();
                    }
                }
            } catch (e) {
                console.error('Ошибка голосования:', e);
                isVotingInProgress = false;
                el.style.opacity = '1';
                el.style.pointerEvents = 'auto';
            }
        }

        // ============================================
        // 🗳️ ГОЛОСОВАНИЯ (список)
        // ============================================
        let allPollsData = [];

        async function loadPolls() {
            const container = document.getElementById('pollsContainer');
            if (!container) return;
            
            try {
                const { data, error } = await supabase
                    .from('polls')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                allPollsData = data || [];

                if (data && data.length > 0) {
                    renderPolls(data);
                } else {
                    container.innerHTML = `
                        <div class="empty-news">
                            <span>🗳️</span>
                            Голосований пока нет.
                            <br><small style="color:#555;">Скоро появятся!</small>
                        </div>
                    `;
                }
            } catch (e) {
                console.error('Ошибка загрузки голосований:', e);
                container.innerHTML = `
                    <div class="empty-news" style="border-color:#6a3c3c;">
                        <span>⚠️</span>
                        Ошибка загрузки голосований
                    </div>
                `;
            }
        }

        function renderPolls(pollsArray) {
            const container = document.getElementById('pollsContainer');
            if (!container || !pollsArray || pollsArray.length === 0) {
                container.innerHTML = `
                    <div class="empty-news">
                        <span>🗳️</span>
                        Голосований пока нет.
                    </div>
                `;
                return;
            }

            let html = '<div class="polls-list">';
            pollsArray.forEach(poll => {
                const formattedDate = formatDateShort(poll.created_at);
                const preview = poll.question ? poll.question.substring(0, 120) + (poll.question.length > 120 ? '...' : '') : '';
                
                html += `
                    <div class="poll-item" data-poll-id="${poll.id}">
                        <div class="poll-date">${formattedDate}</div>
                        <div class="poll-content">
                            <h4>${poll.title || 'Голосование'}</h4>
                            ${preview ? `<div class="poll-preview">${preview}</div>` : ''}
                            <div class="poll-vote-btn">Проголосовать →</div>
                            ${poll.sticker ? `<img src="${poll.sticker}" class="poll-sticker" />` : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            document.querySelectorAll('.poll-item').forEach(el => {
                el.addEventListener('click', function() {
                    const id = parseInt(this.dataset.pollId);
                    const poll = allPollsData.find(p => p.id === id);
                    if (poll) openPollOverlay(poll);
                });
            });
        }

        // ============================================
        // 🗳️ ОТКРЫТИЕ ГОЛОСОВАНИЯ
        // ============================================
        const pollOverlay = document.getElementById('pollOverlay');
        const pollOverlayContent = document.getElementById('pollOverlayContent');
        const closePollOverlayBtn = document.getElementById('closePollOverlay');

        function renderPollInOverlay(pollData) {
            if (!pollData) return '';
            
            const options = pollData.options || [];
            const votes = pollData.votes || options.map(() => 0);
            const totalVotes = votes.reduce((a, b) => a + b, 0);
            const hasVoted = localStorage.getItem('poll_voted_' + pollData.id) === 'true';
            const images = pollData.images || [];

            let html = `
                <div class="overlay-poll-title">${pollData.title || 'Голосование'}</div>
                <div class="overlay-poll-question">${pollData.question || ''}</div>
            `;
            
            const validImages = images.filter(img => img && img.trim() !== '');
            if (validImages.length > 0) {
                html += `<div class="overlay-poll-images">`;
                validImages.forEach(img => {
                    html += `<img src="${img}" alt="Фото" loading="lazy" />`;
                });
                html += `</div>`;
            }

            if (pollData.sticker) {
                html += `<img src="${pollData.sticker}" class="overlay-poll-sticker" />`;
            }

            html += `<div class="poll-options-wrapper" data-poll-id="${pollData.id}">`;

            options.forEach((option, index) => {
                const voteCount = votes[index] || 0;
                const percent = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;
                const isSelected = hasVoted && localStorage.getItem('poll_selected_' + pollData.id) === String(index);

                html += `
                    <div class="overlay-poll-option ${hasVoted ? 'disabled' : ''} ${isSelected ? 'voted' : ''}" 
                         data-index="${index}" 
                         data-poll-id="${pollData.id}"
                         data-voted="${hasVoted ? 'true' : 'false'}">
                        <div class="poll-bar" style="width:${percent}%;"></div>
                        <div class="poll-label">
                            <div class="poll-radio"></div>
                            <span class="poll-text">${option}</span>
                            <span class="poll-votes-count">${voteCount} гол.</span>
                            <span class="poll-percent">${percent}%</span>
                        </div>
                    </div>
                `;
            });

            html += `<div class="poll-total">Всего голосов: ${totalVotes}</div>`;
            if (hasVoted) html += `<div class="poll-message">✅ Вы уже проголосовали</div>`;
            html += `</div>`;

            return html;
        }

        function openPollOverlay(poll) {
            const html = renderPollInOverlay(poll);
            pollOverlayContent.innerHTML = html;
            pollOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                attachPollHandlers();
            }, 100);
        }

        function closePollOverlay() {
            pollOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        closePollOverlayBtn.addEventListener('click', closePollOverlay);
        pollOverlay.addEventListener('click', function(e) {
            if (e.target === pollOverlay) closePollOverlay();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && pollOverlay.classList.contains('open')) closePollOverlay();
        });

        // ============================================
        // 💬 КОММЕНТАРИИ
        // ============================================
        async function loadComments(newsId) {
            const container = document.getElementById('commentsList');
            if (!container) return;
            
            try {
                const { data, error } = await supabase
                    .from('comments')
                    .select('*')
                    .eq('news_id', newsId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    let html = '';
                    data.forEach(comment => {
                        const time = new Date(comment.created_at).toLocaleString('ru-RU', {
                            day: 'numeric',
                            month: 'short',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        html += `
                            <div class="comment">
                                <span class="comment-author">${comment.author || 'Аноним'}</span>
                                <span class="comment-time">${time}</span>
                                <div class="comment-text">${comment.content}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<div class="no-comments">Комментариев пока нет. Будьте первым!</div>`;
                }
            } catch (e) {
                console.error('Ошибка загрузки комментариев:', e);
                container.innerHTML = `<div class="no-comments" style="color:#6a3c3c;">Ошибка загрузки комментариев</div>`;
            }
        }

        // ============================================
        // 🍔 БУРГЕР
        // ============================================
        const burger = document.getElementById('burger');
        const dropdown = document.getElementById('dropdownMenu');
        let isOpen = false;

        if (burger && dropdown) {
            function toggleMenu(e) {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                isOpen = !isOpen;
                if (isOpen) {
                    burger.classList.add('active');
                    dropdown.classList.add('open');
                } else {
                    burger.classList.remove('active');
                    dropdown.classList.remove('open');
                }
            }

            burger.addEventListener('click', toggleMenu);
            burger.addEventListener('touchstart', toggleMenu, { passive: false });

            document.addEventListener('click', function(e) {
                if (dropdown.contains(e.target) || burger.contains(e.target)) return;
                if (isOpen) toggleMenu(e);
            });

            document.addEventListener('touchstart', function(e) {
                if (dropdown.contains(e.target) || burger.contains(e.target)) return;
                if (isOpen) toggleMenu(e);
            }, { passive: true });

            document.addEventListener('scroll', function() {
                if (isOpen) toggleMenu();
            }, { passive: true });
        }

        // ============================================
        // 🧭 НАВИГАЦИЯ
        // ============================================
        const menuLinks = dropdown ? dropdown.querySelectorAll('a[data-page]') : [];
        const pages = {
            home: document.getElementById('page-home'),
            games: document.getElementById('page-games'),
            news: document.getElementById('page-news'),
            polls: document.getElementById('page-polls')
        };

        function showPage(pageId) {
            menuLinks.forEach(link => link.classList.remove('active-link'));
            
            menuLinks.forEach(link => {
                if (link.dataset.page === pageId) {
                    link.classList.add('active-link');
                }
            });

            Object.values(pages).forEach(p => {
                if (p) {
                    p.classList.remove('active');
                    p.style.animation = 'none';
                    void p.offsetHeight;
                    p.style.animation = '';
                }
            });
            if (pages[pageId]) pages[pageId].classList.add('active');
            if (isOpen) toggleMenu();
        }

        menuLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                showPage(this.dataset.page);
            });
            link.addEventListener('touchstart', function(e) {
                e.preventDefault();
                showPage(this.dataset.page);
            }, { passive: false });
        });

        // ============================================
        // 🚀 ЗАПУСК
        // ============================================
        console.log('Inors Games запущен!');
        loadGames();
        loadNews();
        loadPolls();
        
    });
</script>
</body>
</html>
